name: Unix timestamp follow-up validation

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the Spark suites as well as formatting checks
        type: boolean
        default: true
      spark_profiles:
        description: JSON array of Spark profiles to test
        type: string
        default: '["3.4", "3.5", "4.0", "4.1", "4.2"]'
      run_format:
        description: Run formatting and documentation checks
        type: boolean
        default: true

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

jobs:
  test:
    if: inputs.run_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        spark: ${{ fromJSON(inputs.spark_profiles) }}
    env:
      MAVEN_OPTS: -Xmx3g
      SPARK_LOCAL_HOSTNAME: localhost
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29a77851e7d1b72eaafe5cdf884ac72bf32cf4ef
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.spark == '3.4' && '11' || '17' }}
          cache: maven
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Record source and compile tests
        run: |
          mkdir -p target
          git rev-parse HEAD > target/source-sha.txt
          ./mvnw -B -Pspark-${{ matrix.spark }} test-compile -DskipTests -Dspotless.skip=true -Dscalastyle.skip=true 2>&1 | tee compile.log
      - uses: actions/download-artifact@v4
        with:
          name: unix-timestamp-native-release
          path: native/target/release
          run-id: 34757375606
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reused native library and install
        run: |
          test "$(cat native/target/release/source-sha.txt)" = eac00028c74124e9b3b18a6f7968ba4947a6d80c
          test "$(git rev-parse HEAD:native)" = "$(cat native/target/release/native-tree.txt)"
          {
            echo "Native library built and tested in run 34757375606"
            cat native/target/release/source-sha.txt
            cat native/target/release/native-tree.txt
            echo "Current checkout has the identical native source tree"
            cat target/source-sha.txt
          } > target/native-provenance.txt
          ./mvnw -B -Pspark-${{ matrix.spark }},release install -DskipTests -Dspotless.skip=true -Dscalastyle.skip=true 2>&1 | tee install.log
      - name: Run temporal, SQL and applicable collation suites
        run: |
          export SPARK_HOME="$GITHUB_WORKSPACE"
          export COMET_CONF_DIR="$GITHUB_WORKSPACE/conf"
          suites='org.apache.comet.CometTemporalExpressionSuite,org.apache.comet.CometSqlFileTestSuite unix_timestamp'
          case '${{ matrix.spark }}' in
            4.0|4.1) suites="$suites,org.apache.spark.sql.CometCollationSuite" ;;
          esac
          ./mvnw -B -Pspark-${{ matrix.spark }},release test -Dtest=none "-Dsuites=$suites" -Dspotless.skip=true -Dscalastyle.skip=true 2>&1 | tee tests.log
      - name: Verify expected coverage
        env:
          SPARK_PROFILE: ${{ matrix.spark }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          text = Path('tests.log').read_text()
          assert 'All tests passed.' in text
          assert 'unix_timestamp - string input uses codegen dispatch' in text
          if os.environ['SPARK_PROFILE'] in ('4.0', '4.1'):
              assert 'unix_timestamp stays native with a collated format for timestamp input (issue #4646)' in text
          print('Temporal and SQL checks passed, including the collation suite on Spark 4.0 and 4.1.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unix-timestamp-followup-tests-${{ matrix.spark }}
          path: |
            target/source-sha.txt
            target/native-provenance.txt
            *.log
            **/target/surefire-reports
            **/target/unit-tests.log
          retention-days: 30

  format:
    if: inputs.run_format
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        spark: ['4.0', '4.1']
    env:
      MAVEN_OPTS: -Xmx3g
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29a77851e7d1b72eaafe5cdf884ac72bf32cf4ef
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Record source
        run: |
          mkdir -p target
          git rev-parse HEAD > target/source-sha.txt
      - name: Run semantic Scala checks on the supported profile
        if: matrix.spark == '4.0'
        run: |
          ./mvnw -B -Pspark-${{ matrix.spark }},semanticdb compile test-compile scalafix:scalafix -DskipTests -Dscalastyle.skip=true -Dspotless.skip=true
      - name: Apply Scala formatting
        run: |
          ./mvnw -B -Pspark-${{ matrix.spark }} spotless:apply
          git diff --exit-code
      - name: Check style and licenses
        run: |
          ./mvnw -B -Pspark-${{ matrix.spark }} install -DskipTests
          ./mvnw -B -N apache-rat:check
          python3 dev/ci/check-benchmark-runner.py
          python3 dev/ci/check-suites.py
      - name: Verify generated documentation
        run: |
          doc_root="$GITHUB_WORKSPACE/target/unix-timestamp-docs"
          mkdir -p "$doc_root"
          cp -R docs/source/user-guide/latest/. "$doc_root/"
          cp "$doc_root/compatibility/expressions/_category_template/"*.md "$doc_root/compatibility/expressions/"
          ./mvnw -B -Pspark-${{ matrix.spark }},generate-docs package -DskipTests -Dexec.arguments="$doc_root"
          python3 - <<'PY'
          from pathlib import Path
          root = Path('target/unix-timestamp-docs')
          row = next(line for line in (root / 'expressions.md').read_text().splitlines() if line.startswith('| `unix_timestamp` |'))
          assert '| Hybrid |' in row, row
          doc = (root / 'compatibility/expressions/datetime.md').read_text()
          assert 'String inputs, including collated strings, have no native implementation.' in doc
          assert 'Native execution only supports `DateType`, `TimestampType`, and `TimestampNTZType` inputs.' not in doc
          print(row)
          print('The generated unsupported-input explanation describes string inputs.')
          PY
      - name: Save formatting changes
        if: always()
        run: git diff --binary > unix-timestamp-followup-format.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unix-timestamp-followup-format-${{ matrix.spark }}
          path: |
            target/source-sha.txt
            unix-timestamp-followup-format.patch
            target/unix-timestamp-docs/expressions.md
            target/unix-timestamp-docs/compatibility/expressions/datetime.md
            **/target/scalastyle-result.xml
          retention-days: 30

  scalafix-syntactic:
    if: inputs.run_format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29a77851e7d1b72eaafe5cdf884ac72bf32cf4ef
      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:21
      - name: Fetch scalafix
        run: |
          for attempt in 1 2 3; do
            if cs launch scalafix:0.14.6 -- --version; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Check syntax across all Spark sources
        run: |
          cs launch --mode offline scalafix:0.14.6 -- \
            --check --syntactic --config .scalafix-syntactic.conf \
            --exclude '**/target/**' spark
