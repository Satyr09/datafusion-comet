name: Padding formatting

on:
  push:
    branches: [ci/5579-padding-validation]
    paths: [.github/workflows/padding-format.yml]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        spark: ['3.5', '4.0']
    env:
      MAVEN_OPTS: -Xmx3g
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/5579-padding-codegen-dispatch
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: maven
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Record source
        run: |
          mkdir -p target
          git rev-parse HEAD > target/source-sha.txt
      - name: Apply Scala formatting
        run: |
          ./mvnw -B -Pspark-${{ matrix.spark }},semanticdb compile test-compile scalafix:scalafix -DskipTests -Dscalastyle.skip=true -Dspotless.skip=true
          ./mvnw -B -Pspark-${{ matrix.spark }} spotless:apply
      - name: Check style and licenses
        run: |
          ./mvnw -B -Pspark-${{ matrix.spark }} install -DskipTests
          ./mvnw -B -N apache-rat:check
          python3 dev/ci/check-benchmark-runner.py
          python3 dev/ci/check-suites.py
      - name: Verify generated padding documentation
        run: |
          mkdir -p docs/source/user-guide/latest/compatibility/expressions
          ./mvnw -B -Pspark-${{ matrix.spark }},generate-docs package -DskipTests
          python3 - <<'PY'
          from pathlib import Path
          text = Path('docs/source/user-guide/latest/expressions.md').read_text()
          for function in ('lpad', 'rpad'):
              row = next(line for line in text.splitlines() if line.startswith(f'| `{function}` |'))
              assert '| Hybrid |' in row, row
              print(row)
          PY
      - name: Save formatting changes
        if: always()
        run: git diff --binary > padding-format.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: padding-format-${{ matrix.spark }}
          path: |
            target/source-sha.txt
            padding-format.patch
            **/target/scalastyle-result.xml
          retention-days: 7
